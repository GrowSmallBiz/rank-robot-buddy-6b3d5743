    <meta name="author" content="GrowSmallBiz Digital Marketing" />

    <!-- Host-aware noindex: prevent staging/preview *.lovable.app mirrors from being indexed -->
    <script>
      (function () {
        try {
          var host = window.location.hostname;
          // Block indexing on any non-production host (lovable.app previews, published staging, localhost)
          var isProduction = host === 'growsmallbiz.io' || host === 'www.growsmallbiz.io';
          if (!isProduction) {
            // Remove any existing robots meta (helmet-injected or otherwise) and force noindex,nofollow
            var existingRobots = document.querySelectorAll('meta[name="robots"]');
            existingRobots.forEach(function (el) { el.parentNode.removeChild(el); });
            var m = document.createElement('meta');
            m.name = 'robots';
            m.content = 'noindex, nofollow';
            document.head.appendChild(m);

            // Point canonical at the production equivalent so any link equity consolidates there
            var canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.parentNode.removeChild(canonical);
            var link = document.createElement('link');
            link.rel = 'canonical';
            link.href = 'https://growsmallbiz.io' + window.location.pathname + window.location.search;
            document.head.appendChild(link);
          }
        } catch (e) { /* no-op */ }
      })();
    </script>

    <!-- Juhi AI Concierge Chatbot - deferred until after user interaction to avoid forced reflow -->
    <script>
      (function() {
        var chatLoaded = false;
        function loadChatWidget() {
          if (chatLoaded) return;
          chatLoaded = true;
          var s = document.createElement('script');
          s.src = 'https://botdisplay.com/chat-widget.js';
          s.dataset.color = '#3d71bf';
          s.dataset.assistantId = '1763509281876x767403296729333800';
          s.dataset.accountId = '4KL47iKeJZ2Ee05j7FBh';
          s.dataset.position = 'bottom-right';
          s.dataset.theme = 'light';
          s.dataset.showPrompt = 'true';
          s.dataset.autoOpen = 'false';
          s.dataset.promptMessage = "Hi, I'm Juhi, Juhi AI Concierge, You Can Ask Questions Here + schedule a discovery call";
          s.dataset.assistantName = 'Juhi AI Concierge';
          s.dataset.buttonIcon = '';
          s.dataset.greetingMessage = 'Hi there! My name is {assistant_name} AI Concierge. How can I help today?';
          s.dataset.prompts = '[]';
          document.body.appendChild(s);
        }
        // Only load after first user interaction (scroll, click, touch, or mousemove)
        var events = ['scroll', 'click', 'touchstart', 'mousemove', 'keydown'];
        function onInteraction() {
          events.forEach(function(e) { window.removeEventListener(e, onInteraction); });
          setTimeout(loadChatWidget, 2000);
        }
        events.forEach(function(e) { window.addEventListener(e, onInteraction, { once: false, passive: true }); });
        // Fallback: load after 15s even without interaction
        setTimeout(loadChatWidget, 15000);
      })();
    </script>
